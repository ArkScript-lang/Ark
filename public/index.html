<!DOCTYPE html>
<html lang="en">
<head>
    <title>ArkScript emscripten</title>
</head>
<body>
<div>
    <textarea id="code" cols="80" rows="10"></textarea>
    <button id="run">Submit</button>
</div>
<div>
    <textarea id="output" cols="80" rows="10" readonly></textarea>
</div>

<script>
    log = console.log;
    var can_capture = false;

    window.console.log = (message) => {
        log(message);
        if (can_capture)
            document.getElementById("output").value += message + "\n";
    };

    var Module = {
        onRuntimeInitialized: function () {
            document.getElementById("run").addEventListener("click", () => {
                document.getElementById("output").value = "";
                const code = document.getElementById("code").value;

                try {
                    can_capture = true;
                    Module.run(code);
                } catch (e) {
                    document.getElementById("output").value = e;
                }

                can_capture = false;
            });
        }
    };
</script>

<script>
    (function (e, t) {
        console.log("Loading client...");

        const scriptName = `ArkEmscripten${e.WebAssembly ? ".wasm" : ""}.js`;
        console.log(`Script set to ${scriptName}`);

        const loader = t.createElement("script");
        loader.async = true;
        loader.type = "text/javascript";
        loader.src = scriptName;
        loader.onerror = (t) => {
            console.error("Script Error");
            console.error(t);
            setTimeout(() => {
                e.location.reload();
            }, 3000);
        };

        const node = t.getElementsByTagName("script")[0];
        node.parentNode.insertBefore(loader, node);
    })(window, document);
</script>
</body>
</html>
