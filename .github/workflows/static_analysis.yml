name: Static analysis

on:
  pull_request:

permissions:
  pull-requests: write  # Required for commenting on pull requests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - run: |
          sudo apt install -yq cppcheck
          pip install lizard

      - name: Create lizard report
        id: lizard
        shell: bash
        run: |
          content=$(python .github/launch-lizard.py $(echo $(git diff --name-only -r HEAD^1 HEAD)))
          echo "LIZARD_REPORT<<EOF" >> $GITHUB_ENV
          echo "$content" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run cppcheck
        id: cppcheck
        shell: bash
        run: |
          cppcheck --platform=unix64 --template="{file}:{line}: {severity}: {message}" \
            --output-file=cppcheck.txt \
            -I include src \
            --enable=all --inline-suppr \
            --suppressions-list=cppcheck-suppressions.txt
          content=$(python .github/generate_cppcheck_report.py $(echo $(git diff --name-only -r HEAD^1 HEAD)))
          echo "CPPCHECK_REPORT<<EOF" >> $GITHUB_ENV
          echo "$content" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Find Comment
        uses: peter-evans/find-comment@fec22f13a3d7a949297e4b5f6b9f99a423eabba1 # v3.1.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Static analysis report

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@cf911f109bd9a26f1d626a8c3276384ddec0e552 # v4.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Static analysis report
            ${{ env.LIZARD_REPORT }}

            ---

            ${{ env.CPPCHECK_REPORT }}
          edit-mode: replace
