name: Static analysis

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - run: |
          sudo apt install -yq cppcheck
          pip install lizard

      - name: Create lizard report
        id: lizard
        shell: bash
        run: |
          content=$(python .github/launch-lizard.py $(echo $(git diff --name-only -r HEAD^1 HEAD)))
          echo "LIZARD_REPORT<<EOF" >> $GITHUB_ENV
          echo "$content" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run cppcheck
        id: cppcheck
        shell: bash
        run: |
          cppcheck --platform=unix64 --template="{file}:{line}: {severity}: {message}" \
            --output-file=cppcheck.txt \
            -I include src \
            --enable=all --inline-suppr --check-level=exhaustive \
            --suppressions-list=cppcheck-suppressions.txt
          content=$(python .github/generate_cppcheck_report.py $(echo $(git diff --name-only -r HEAD^1 HEAD)))
          echo "CPPCHECK_REPORT<<EOF" >> $GITHUB_ENV
          echo "$content" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Save PR identifiers
        run: |
          mkdir -p ./pr
          echo ${{ github.event.number }} > ./pr/NR
          echo "Static analysis report" > ./pr/slug

          echo "## Static analysis report" > ./pr/comment
          echo "${{ env.LIZARD_REPORT }}" >> ./pr/comment
          echo -e "\n---\n" >> ./pr/comment
          echo "${{ env.CPPCHECK_REPORT }}" >> ./pr/comment

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr
          path: pr/
